; PHP Configuration for Go Deep Africa Safari
; Increases upload limits for large images and form data

; Maximum file upload size (50MB)
upload_max_filesize = 50M

; Maximum POST data size (100MB)
post_max_size = 100M

; Maximum execution time (300 seconds = 5 minutes)
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Memory limit
memory_limit = 512M

; Maximum file uploads at once
max_file_uploads = 20

; Temporary upload directory
upload_tmp_dir = /tmp
